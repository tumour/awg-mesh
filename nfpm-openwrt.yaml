# nfpm config для сборки .apk-пакета под OpenWrt 25.12+ (apk-tools v3).
# Используется через `nfpm pkg --packager apk --target out.apk`.
#
# nfpm генерит apk v2-формат — apk-tools v3 в OpenWrt читает его нативно.
# Пакет не подписан, поэтому ставится через `apk add --allow-untrusted`.
#
# arch — режим зависит от способа доставки:
#   * standalone .apk (ручная установка, `make package-openwrt`): APK_ARCH=all.
#     "all" принимается любым устройством; нужный CPU-вариант пользователь
#     выбирает по имени файла (meshd_X.Y.Z_openwrt-<goarch>.apk).
#   * apk-фид (build-feed.sh): APK_ARCH=<конкретная OpenWrt-арка>, т.к. в фиде
#     apk сам выбирает пакет по `cat /etc/apk/arch` и арка обязана совпадать.
#
# Параметры (${GOARCH}, ${APK_ARCH}, ${VERSION}, ${APK_SIGN_KEY_FILE})
# подставляются через envsubst (Makefile для standalone, build-feed.sh для фида).

name: meshd
arch: ${APK_ARCH}
platform: linux
version: ${VERSION}
maintainer: Alexandr <ivanov94.94@mail.ru>
description: |
  AmneziaWG-based mesh networking daemon.
  DPI-resistant point-to-point tunnels with gossip peer discovery,
  Noise IKpsk2 bootstrap handshake, Tailscale-style auth-tokens.
vendor: tumour
homepage: https://github.com/tumour/awg-mesh
license: MIT

# kmod-tun: /dev/net/tun на OpenWrt не входит в дефолтный образ.
# Резолвится из стандартных фидов (нужен `apk update` перед установкой).
# iproute2 не нужен: busybox-овский ip покрывает addr add / link set / link delete.
depends:
  - kmod-tun

contents:
  - src: ./bin/meshd-linux-${GOARCH}
    dst: /usr/bin/meshd
    file_info:
      mode: 0755
  - src: ./deploy/openwrt/meshd.init
    dst: /etc/init.d/meshd
    file_info:
      mode: 0755
  - src: ./LICENSE
    dst: /usr/share/doc/meshd/LICENSE
    file_info:
      mode: 0644

# apk-хуки: postinstall -> .post-install, preremove -> .pre-deinstall.
# Аналога postrm purge у apk нет — state.json остаётся после удаления пакета.
scripts:
  postinstall: ./deploy/openwrt/post-install
  preremove:   ./deploy/openwrt/pre-deinstall

# apk-специфика: подпись фида + postupgrade.
apk:
  # Подпись пакета. apk-tools v3 на устройстве проверяет её по публичному ключу
  # /etc/apk/keys/awg-mesh-apk.rsa.pub. key_file подставляется через env:
  # в CI APK_SIGN_KEY_FILE указывает на приватный ключ из secret; локально
  # переменная пуста → nfpm собирает пакет без подписи (для отладки сборки).
  signature:
    key_file: ${APK_SIGN_KEY_FILE}
    key_name: awg-mesh-apk
  # ВАЖНО: при `apk upgrade` apk-tools v3 вызывает postupgrade, а НЕ postinstall
  # (проверено эмпирически). Без этого обновление через фид не перезапустило бы
  # демон. Переиспользуем post-install — он рестартует meshd при наличии state.json.
  scripts:
    postupgrade: ./deploy/openwrt/post-install
