# Dependabot: автоматически двигает пиннутые версии/SHA (см. workflow'ы —
# actions пиннуты по commit-SHA; Dependabot обновляет и SHA, и комментарий # vX,
# так что пины не застаивают security-патчи). gomod — проактивно к govulncheck.
version: 2
updates:
  # GitHub Actions в .github/workflows/* (SHA-пины checkout/setup-go/nfpm-actions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Go-зависимости (крипто-VPN — обновления безопасности важны; govulncheck в CI
  # ловит уже вызываемые CVE, Dependabot подтягивает фиксы проактивно).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # У апстрима немонотонная история тегов: линейка 1.x (последний v1.0.4,
      # 2025-07) СТАРШЕ семверно, но СТАРЕЕ по коду, чем актуальная 0.2.x
      # (v0.2.19 — 2026-06). Без ignore Dependabot вечно предлагает «апгрейд»
      # 0.2.x → 1.0.4, который на деле — даунгрейд ядра data plane на год назад.
      - dependency-name: github.com/amnezia-vpn/amneziawg-go
        versions: ["1.x"]
