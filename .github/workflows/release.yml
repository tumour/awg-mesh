name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # for creating Release + uploading assets

jobs:
  release:
    name: build .deb + create release
    runs-on: ubuntu-latest
    outputs:
      feed: ${{ steps.prep.outputs.feed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # для git describe в Makefile

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: install envsubst
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: build binaries
        run: make build-all

      - name: build .deb packages
        run: make package-all

      - name: build .apk packages (OpenWrt)
        run: make package-openwrt

      - name: list artifacts
        run: ls -la bin/ dist/

      # SHA256SUMS для проверки целостности — закрывает file-режим self-upgrade
      # и ручные скачивания (apk-путь уже подписан, raw-бинари были голыми).
      # NB: это только integrity. Для authenticity нужна подпись SHA256SUMS
      # (minisign, gated на отдельном секрете) — см. README/known limitations.
      - name: generate SHA256SUMS
        run: |
          sha256sum \
            bin/meshd-linux-amd64 bin/meshd-linux-arm64 bin/meshd-linux-armv7 \
            bin/meshd-linux-mipsle bin/meshd-linux-mips \
            dist/meshd_*_amd64.deb dist/meshd_*_arm64.deb dist/meshd_*_openwrt-*.apk \
            | awk '{ n=$2; sub(/.*\//,"",n); print $1"  "n }' > SHA256SUMS
          cat SHA256SUMS

      # Тело релиза = секция CHANGELOG.md для этой версии (как у нормальных
      # пакетов), а не авто-список коммитов.
      - name: extract changelog for this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; print; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || printf "## %s\n\nSee CHANGELOG.md for details.\n" "$VERSION" > RELEASE_NOTES.md
          echo "--- release notes ---"; cat RELEASE_NOTES.md

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            SHA256SUMS
            bin/meshd-linux-amd64
            bin/meshd-linux-arm64
            bin/meshd-linux-armv7
            bin/meshd-linux-mipsle
            bin/meshd-linux-mips
            dist/meshd_*_amd64.deb
            dist/meshd_*_arm64.deb
            dist/meshd_*_openwrt-*.apk

      # --- Подписанный apk-фид для OpenWrt (apk-tools v3) ---
      # Требует repo-secret APK_SIGN_KEY (приватный RSA, парный к
      # deploy/openwrt/awg-mesh-apk.rsa.pub) и Pages Source = "GitHub Actions"
      # (Settings → Pages). Без секрета шаги тихо пропускаются (фид не публикуется).
      - name: prepare signing key
        id: prep
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -z "$APK_SIGN_KEY" ]; then
            echo "APK_SIGN_KEY secret not set — skipping feed build"
            echo "feed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Имя файла важно: подпись индекса ищет <basename>.pub на устройстве.
          mkdir -p /tmp/feedkeys
          printf '%s' "$APK_SIGN_KEY" > /tmp/feedkeys/awg-mesh-apk.rsa
          chmod 600 /tmp/feedkeys/awg-mesh-apk.rsa
          # build-feed.sh кладёт публичный ключ в /etc/apk/keys контейнера, чтобы
          # apk mkndx мог проверить подпись входных пакетов — он берёт .pub из той
          # же папки, что и приватный ключ, поэтому копируем его рядом.
          cp deploy/openwrt/awg-mesh-apk.rsa.pub /tmp/feedkeys/awg-mesh-apk.rsa.pub
          echo "feed=1" >> "$GITHUB_OUTPUT"

      - name: build signed apk feed
        if: steps.prep.outputs.feed == '1'
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME#v}" | grep -oE '^[0-9]+(\.[0-9]+)*')
          # дерево фида + публичный ключ кладём в public/openwrt/ для Pages
          OUT=public/openwrt VERSION="$VERSION" \
            APK_SIGN_KEY_FILE=/tmp/feedkeys/awg-mesh-apk.rsa \
            sh deploy/openwrt/build-feed.sh
          cp deploy/openwrt/awg-mesh-apk.rsa.pub public/openwrt/awg-mesh-apk.rsa.pub
          # landing-страница в корне Pages (иначе корневой URL = 404)
          cp deploy/openwrt/feed-index.html public/index.html
          rm -f /tmp/feedkeys/awg-mesh-apk.rsa

      - name: upload Pages artifact
        if: steps.prep.outputs.feed == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Деплой фида на GitHub Pages через Actions (Source = "GitHub Actions" в
  # Settings → Pages). Отдельный job с нужными правами; идёт только если фид собран.
  deploy-pages:
    name: deploy feed to GitHub Pages
    needs: release
    if: needs.release.outputs.feed == '1'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
