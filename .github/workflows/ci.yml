name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      # Actions пиннуты по commit-SHA: мажорный тег vX мутабелен (владелец/угнанный
      # аккаунт может переехать на зловредный коммит). Комментарий = human-версия;
      # Dependabot двигает и SHA, и комментарий. См. GitHub Docs «secure use».
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      # Известные CVE в зависимостях/stdlib — для крипто-VPN обязательно. govulncheck
      # режет по реально вызываемому коду, не по всему графу. Версия пиннута (не @latest).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...

      - name: build (all archs)
        run: make build-all

      - name: smoke-test binary
        run: |
          ./bin/meshd-linux-amd64 version
          ./bin/meshd-linux-amd64 help
