name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: build (all archs)
        run: make build-all

      - name: smoke-test binary
        run: |
          ./bin/meshd-linux-amd64 version
          ./bin/meshd-linux-amd64 help
